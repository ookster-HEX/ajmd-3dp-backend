[project]
name = "ajmd-3dp-backend"
version = "1.0.0"
description = "FastAPI backend for the AJMD 3D printing quoting web application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
]