services:
  fastapi-slicer:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-orcaslicer:latest
    container_name: fastapi-orcaslicer
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: "sqlite:////data/db/app.db"
      SECRET_KEY: "${SECRET_KEY}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      ORCA_SLICER_BIN: "/usr/local/bin/orca-slicer"
      ORCA_PROFILES_DIR: "/data/profiles"
    volumes:
      - /mnt/nas1/ajmd/db:/data/db
      - /mnt/nas1/ajmd/profiles:/data/profiles
