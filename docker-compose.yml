services:
  ajmd-3dp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ajmd-3dp-backend
    restart: unless-stopped
    shm_size: "512m"
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/3dp.db"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-604800}"
      ORCA_SLICER_BIN: "/usr/local/bin/orca-slicer"
      ORCA_PROFILES_DIR: "/app/profiles"
    volumes:
      - ajmd_3dp_data:/app/data
      - ajmd_3dp_storage:/app/storage
      - ajmd_3dp_profiles:/app/profiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ajmd_3dp_data:
  ajmd_3dp_storage:
  ajmd_3dp_profiles:
